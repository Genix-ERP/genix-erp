services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: genix-frontend
    restart: unless-stopped
    ports:
      # Host port comes from .env (FRONTEND_PORT). Different environments
      # need different host ports — e.g. on the Yuksalish server port 3000
      # is taken by another stack, so we bind to 3001 there; on the prod
      # Genix server 3000 is free. Set FRONTEND_PORT in each server's .env
      # so the value isn't a local hand-edit that gets clobbered on merge.
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
